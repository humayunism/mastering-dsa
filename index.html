<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mastering DSA | by Humayun Kabir</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="A chapter-based data structures and algorithms book with guided navigation, reading progress, and cleaner chapter discovery."
  >
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">Loading the book...</div>

  <script>
    const CHAPTERS = [
      { label: '00. The Foundation', path: '#/00-prerequisites/README' },
      { label: '01. Two Pointers', path: '#/01-two-pointers/README' },
      { label: '02. Hash Maps & Sets', path: '#/02-hash-maps-and-sets/README' },
      { label: '03. Linked Lists', path: '#/03-linked-lists/README' },
      { label: '04. Fast & Slow Pointers', path: '#/04-fast-and-slow-pointers/README' },
      { label: '05. Sliding Windows', path: '#/05-sliding-windows/README' },
      { label: '06. Binary Search', path: '#/06-binary-search/README' },
      { label: '07. Stacks and Queues', path: '#/07-stacks-and-queues/README' },
      { label: '08. Heaps', path: '#/08-heaps/README' },
      { label: '09. Intervals', path: '#/09-intervals/README' },
      { label: '10. Prefix Sums', path: '#/10-prefix-sums/README' },
      { label: '11. Tries', path: '#/11-tries/README' },
      { label: '13. Graphs', path: '#/13-graphs/README' },
      { label: '14. Backtracking', path: '#/14-backtracking/README' },
      { label: '15. Dynamic Programming', path: '#/15-dynamic-programming/README' },
      { label: '16. Greedy Algorithms', path: '#/16-greedy-algorithms/README' },
      { label: '17. Sort and Search', path: '#/17-sort-and-search/README' },
      { label: '18. Bit Manipulation', path: '#/18-bit-manipulation/README' },
      { label: '19. Math and Geometry', path: '#/19-math-and-geometry/README' }
    ];

    function getCurrentChapterIndex() {
      const hash = decodeURIComponent(window.location.hash || '#/');

      for (let i = 0; i < CHAPTERS.length; i += 1) {
        const fragment = CHAPTERS[i].path.replace('#', '');
        if (hash === fragment || hash.indexOf(fragment + '/') === 0) {
          return i;
        }
      }

      return -1;
    }

    function buildReaderBar() {
      const docsifyApp = document.querySelector('.app');
      if (!docsifyApp) return;

      let bar = document.getElementById('reader-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'reader-bar';
        bar.className = 'reader-bar';
        docsifyApp.prepend(bar);
      }

      const chapterIndex = getCurrentChapterIndex();
      const currentChapter = chapterIndex >= 0 ? CHAPTERS[chapterIndex] : null;
      const chapterLabel = currentChapter ? currentChapter.label : 'Table of contents';
      const progressText = currentChapter
        ? 'Chapter ' + (chapterIndex + 1) + ' of ' + CHAPTERS.length
        : 'Browse all chapters';

      bar.innerHTML =
        '<div class="reader-bar__inner">' +
          '<div class="reader-bar__meta">' +
            '<span class="reader-bar__eyebrow">Mastering DSA</span>' +
            '<strong class="reader-bar__title">' + chapterLabel + '</strong>' +
          '</div>' +
          '<div class="reader-bar__controls">' +
            '<label class="reader-select-label" for="chapter-select">Jump to</label>' +
            '<select id="chapter-select" class="reader-select" aria-label="Jump to chapter">' +
              '<option value="#/">' + progressText + '</option>' +
              CHAPTERS.map(function (chapter) {
                return '<option value="' + chapter.path + '">' + chapter.label + '</option>';
              }).join('') +
            '</select>' +
            '<button id="focus-toggle" class="reader-action" type="button" aria-pressed="false">Focus mode</button>' +
            '<button id="back-to-top" class="reader-action reader-action--ghost" type="button">Top</button>' +
          '</div>' +
        '</div>';

      const select = document.getElementById('chapter-select');
      if (select) {
        select.value = currentChapter ? currentChapter.path : '#/';
        select.onchange = function (event) {
          window.location.hash = event.target.value;
        };
      }

      const focusToggle = document.getElementById('focus-toggle');
      if (focusToggle) {
        const body = document.body;
        const focusEnabled = body.classList.contains('focus-mode');
        focusToggle.setAttribute('aria-pressed', String(focusEnabled));
        focusToggle.textContent = focusEnabled ? 'Exit focus' : 'Focus mode';
        focusToggle.onclick = function () {
          body.classList.toggle('focus-mode');
          const enabled = body.classList.contains('focus-mode');
          focusToggle.setAttribute('aria-pressed', String(enabled));
          focusToggle.textContent = enabled ? 'Exit focus' : 'Focus mode';
        };
      }

      const backToTop = document.getElementById('back-to-top');
      if (backToTop) {
        backToTop.onclick = function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
      }
    }

    function buildChapterFooter() {
      const target = document.getElementById('chapter-nav-inject');
      if (!target) return;

      const chapterIndex = getCurrentChapterIndex();
      const prev = chapterIndex > 0 ? CHAPTERS[chapterIndex - 1] : null;
      const next = chapterIndex >= 0 && chapterIndex < CHAPTERS.length - 1
        ? CHAPTERS[chapterIndex + 1]
        : null;
      const current = chapterIndex >= 0 ? chapterIndex + 1 : 0;
      const total = CHAPTERS.length;
      const progress = current > 0 ? Math.round((current / total) * 100) : 0;
      const label = current > 0 ? 'Reading progress' : 'Book overview';

      target.innerHTML =
        '<section class="chapter-nav" aria-label="Chapter navigation">' +
          '<div class="chapter-nav__progress">' +
            '<span class="chapter-nav__label">' + label + '</span>' +
            '<strong class="chapter-nav__chapter">' +
              (current > 0 ? ('Chapter ' + current + ' of ' + total) : 'Choose a chapter from the sidebar') +
            '</strong>' +
            '<div class="chapter-nav__bar"><span class="chapter-nav__fill" style="width:' + progress + '%"></span></div>' +
          '</div>' +
          '<div class="chapter-nav__actions">' +
            (prev
              ? '<a class="nav-btn nav-btn--prev" href="' + prev.path + '">Previous: ' + prev.label + '</a>'
              : '<span class="nav-btn nav-btn--disabled">Start of book</span>') +
            (next
              ? '<a class="nav-btn nav-btn--next" href="' + next.path + '">Next: ' + next.label + '</a>'
              : '<span class="nav-btn nav-btn--disabled">End of book</span>') +
          '</div>' +
        '</section>';
    }

    window.$docsify = {
      name: 'MASTERING DATA STRUCTURES & ALGORITHMS',
      nameLink: '#/',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      themeColor: '#1c7c54',
      plugins: [
        function (hook) {
          hook.afterEach(function (html) {
            return html + '<div id="chapter-nav-inject"></div>';
          });

          hook.doneEach(function () {
            buildReaderBar();
            buildChapterFooter();
          });
        }
      ]
    };

    window.addEventListener('hashchange', function () {
      window.requestAnimationFrame(function () {
        buildReaderBar();
        buildChapterFooter();
      });
    });
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
</body>
</html>
